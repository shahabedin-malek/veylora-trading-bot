name: foundation-checks

on:
  push:
  pull_request:

jobs:
  quality:
    # Pinned, not `ubuntu-latest`: the label is migrating to Ubuntu 26, and the browser-dependency
    # install and the native modules in this tree were measured on 24.04.
    runs-on: ubuntu-24.04
    steps:
      # Each of these runs on Node 24; the v4/v5 lines ran on Node 20, which the runner now
      # forces onto Node 24 and warns about on every run.
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: apps/web
      - name: Generate Prisma client
        run: pnpm exec prisma generate --schema prisma/schema.prisma
        working-directory: apps/web
      - name: Generate Next.js types
        run: pnpm exec next typegen
        working-directory: apps/web
      - name: Typecheck
        run: pnpm typecheck
        working-directory: apps/web
      - name: Tests
        run: pnpm test
        working-directory: apps/web
      - name: Environment parity
        # Every Production variable is present in the other scopes, or its absence is declared
        # with a reason in scripts/env-parity.mjs. Fails on an undeclared difference.
        run: node scripts/env-parity.mjs --check
        working-directory: apps/web
      - name: Build
        run: pnpm build
        working-directory: apps/web
      - name: Plan validator
        run: node scripts/validate_plan.mjs
        working-directory: .
      - name: No environment file is committed
        # `.env.example` is a template of names and belongs in git; a filled-in file does not.
        run: |
          committed=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$' || true)
          if [ -n "$committed" ]; then
            echo "Committed environment file(s) — remove them and their history before publishing:"
            echo "$committed"
            exit 1
          fi
          echo "No committed environment file."
        working-directory: .
      - name: Install Playwright browser
        run: pnpm --config.verify-deps-before-run=false exec playwright install --with-deps chromium
        working-directory: apps/web
      - name: Browser end-to-end
        run: pnpm --config.verify-deps-before-run=false e2e
        working-directory: apps/web
        env:
          E2E_OUTPUT_DIR: ${{ runner.temp }}/veylora-e2e-results
      - name: Upload browser failure artifacts
        # always(), not failure(): GitHub does not resolve an action whose step never runs, so a
        # broken reference here would first surface on the one run that needs the artifacts.
        # On a green run the directory is empty and `if-no-files-found: ignore` stores nothing.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-artifacts
          path: ${{ runner.temp }}/veylora-e2e-results
          if-no-files-found: ignore
          retention-days: 7

  failure-artifacts:
    # Runs only when `quality` fails, and does the half a skipped step cannot: fetch the artifact
    # back and assert the suite's own report is inside it. Completion is not proof — a name typo or
    # a version bump that changes the archive layout would only be visible here, after the upload.
    needs: quality
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - name: Download the failure artifacts
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: playwright-failure-artifacts
          path: ${{ runner.temp }}/failure-artifacts
      - name: Assert the failure report came back
        env:
          ROOT: ${{ runner.temp }}/failure-artifacts
        run: |
          if [ "${{ steps.download.outcome }}" != "success" ]; then
            echo "::notice::The failing run kept no artifacts, so the browser suite did not get to run."
            exit 0
          fi
          echo "Artifacts the failing browser test retained:"
          find "$ROOT" -type f | sed "s|$ROOT/||" | sort | head -40
          trace=$(find "$ROOT" -name 'trace.zip' -print -quit)
          if [ -z "$trace" ]; then
            echo "::error::The downloaded artifact holds no trace.zip, so a failure could not be replayed."
            exit 1
          fi
          echo "trace: $trace ($(wc -c < "$trace") bytes)"
          if [ -z "$(find "$ROOT" \( -name '*.png' -o -name '*.webm' -o -name 'error-context.md' \) -print -quit)" ]; then
            echo "::error::The downloaded artifact holds no screenshot, video or error context."
            exit 1
          fi

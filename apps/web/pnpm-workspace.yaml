allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@reown/appkit': false
  bufferutil: set this to true or false
  ccxt: set this to true or false
  esbuild: true
  keccak: set this to true or false
  prisma: true
  sharp: false
  unrs-resolver: false
  utf-8-validate: set this to true or false
minimumReleaseAgeExclude:
  - viem@2.57.5
overrides:
  # Phase 39: transitive advisories fixed without changing a direct dependency.
  # Each range is the vulnerable range from `pnpm audit`, restricted so an
  # unaffected major (ws 7.x) keeps the version its consumer expects.
  # `braces` is not overridden: the advisory's patched range (>=3.0.4) names a
  # version that was never published; it is dev-only through eslint-config-next.
  'ws@>=8.0.0 <8.21.0': 8.21.0
  'decode-uri-component@<=0.4.2': 0.5.0
  'deepmerge-ts@<8.0.0': 8.0.0
  'uuid@<11.1.1': 11.1.1
